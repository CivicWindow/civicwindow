# gradle/libs.versions.toml: the version catalog. A dependency or plugin version is written
# here and nowhere else (ADR-0007, rule 1). The Gradle version is the one exception: it lives
# in gradle/wrapper/gradle-wrapper.properties.
#
# Standard: Gradle documentation on version catalogs
# (https://docs.gradle.org/current/userguide/version_catalogs.html). Aliases use kebab-case,
# which Gradle turns into the accessors libs.<name> shown in the comments. Each table is
# sorted by alias.
#
# Versions follow ADR-0001 to ADR-0003, ADR-0006 and ADR-0009. They are the checked set of
# November 2026 and are checked again at the first build. A value marked "open" is not confirmed
# yet and is settled by the first build.
#
# Enforcement: the Gradle build fails on a plugin or library alias that is not declared here,
# because the accessor does not exist. Review is the check that no version is written outside
# this file until a build check is added.

[versions]
# Application libraries (AndroidX release notes).
activityCompose = "1.13.0"
# Android Gradle Plugin 9.3.3: the newest 9.3 patch (AGP 9.3 release notes). open: Kotlin's
# table names 9.3.1 as its upper tested patch; the first build confirms the pairing.
agp = "9.3.3"
# AndroidX Test (AndroidX release notes): the runner, rules, core and the JUnit extension.
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRules = "1.7.0"
androidxTestRunner = "1.7.0"
# Android SDK levels (ADR-0003): declared once, here.
# open: compileSdk 37 follows the Compose setup documentation; some pages still use preview
# wording for it, so the first build confirms it.
compileSdk = "37"
# Compose Bill of Materials 2026.09.00. open: the Material 3 version it resolves to is
# recorded at the first build.
composeBom = "2026.09.00"
coreKtx = "1.19.1"
# JDK 17: the minimum and default of AGP 9.3 (ADR-0002).
jdk = "17"
# JUnit 4 (ADR-0009): the unit-test framework and the framework of the device-test runner.
junit = "4.13.2"
# Kotlin 2.4.21: the Kotlin Gradle plugin compatibility table lists it with Gradle 9.6 and
# AGP 9.3 (https://kotlinlang.org/docs/gradle-configure-project.html).
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
# open: ktlint 1.8.0 is the latest stable release; no page states support for Kotlin 2.4.
# Checked again at the first build.
ktlint = "1.8.0"
# open: ktlint Gradle plugin 14.2.0; no page states support for Kotlin 2.4 or AGP 9.3.
# Checked again at the first build.
ktlintGradle = "14.2.0"
lifecycleRuntimeKtx = "2.11.0"
minSdk = "26"
mockk = "1.14.12"
targetSdk = "36"
turbine = "1.2.1"

[libraries]
# open: the group and name of each coordinate below are checked at the first build.
# libs.android.gradle.plugin (for build-logic only)
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
# libs.androidx.activity.compose
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# libs.androidx.compose.bom
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# libs.androidx.compose.foundation (version from the Bill of Materials)
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# libs.androidx.compose.material3 (version from the Bill of Materials)
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# libs.androidx.compose.ui (version from the Bill of Materials)
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# libs.androidx.compose.ui.test.junit4 (version from the Bill of Materials)
# open: the Compose Bill of Materials' mapping for ui-test-junit4 is confirmed at the first build.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# libs.androidx.compose.ui.test.manifest (version from the Bill of Materials)
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# libs.androidx.core.ktx
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# libs.androidx.lifecycle.runtime.ktx
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# libs.androidx.test.core
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
# libs.androidx.test.ext.junit
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
# libs.androidx.test.rules
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
# libs.androidx.test.runner
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
# libs.compose.compiler.gradle.plugin (for build-logic only)
compose-compiler-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
# libs.junit
# open: the coordinate is checked at the first build.
junit = { group = "junit", name = "junit", version.ref = "junit" }
# libs.kotlin.gradle.plugin (for build-logic only)
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
# libs.kotlin.test
# open: the version follows the Kotlin Gradle plugin and resolves to kotlin-test-junit; confirmed at
# the first build.
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# libs.kotlinx.coroutines.test
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# libs.ktlint.gradle.plugin (for build-logic only, compileOnly). open: the coordinate is checked at the first build.
ktlint-gradle-plugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlintGradle" }
# libs.mockk
# open: the coordinate is checked at the first build.
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
# libs.mockk.android
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
# libs.turbine
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
# open: the plugin ids below are checked at the first build.
# There is no alias for org.jetbrains.kotlin.android: Android modules use the Kotlin support
# built into the Android Gradle Plugin
# (https://developer.android.com/build/migrate-to-built-in-kotlin).
# libs.plugins.android.application
android-application = { id = "com.android.application", version.ref = "agp" }
# libs.plugins.android.library
android-library = { id = "com.android.library", version.ref = "agp" }
# libs.plugins.kotlin.compose (the Compose compiler plugin, at the Kotlin version)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# libs.plugins.kotlin.jvm
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# libs.plugins.ktlint
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
