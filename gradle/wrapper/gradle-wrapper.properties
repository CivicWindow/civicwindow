# gradle/wrapper/gradle-wrapper.properties: pins the Gradle version for everyone (ADR-0002).
#
# Standard: Gradle documentation on the Gradle Wrapper
# (https://docs.gradle.org/current/userguide/gradle_wrapper.html). Gradle 9.6.0 is the
# version ADR-0002 states; the checksum is the one Gradle publishes for the "bin" archive of
# that version (https://gradle.org/release-checksums/). The version is checked again at the
# first build. The address form below is open: the first build confirms it.
#
# The wrapper scripts and the wrapper jar are made by the Gradle wrapper task and are not
# written by hand; the first-run command is in the development environment guide.
#
# Enforcement: the wrapper refuses a download whose checksum differs from distributionSha256Sum
# and validates the distribution address (validateDistributionUrl).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
