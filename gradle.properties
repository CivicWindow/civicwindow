# gradle.properties: build settings and the one place the app version is written.
#
# Standard: Gradle documentation on build environment settings
# (https://docs.gradle.org/current/userguide/build_environment.html), the build cache
# (https://docs.gradle.org/current/userguide/build_cache.html) and the configuration cache
# (https://docs.gradle.org/current/userguide/configuration_cache.html); Kotlin coding
# conventions (https://kotlinlang.org/docs/coding-conventions.html).
#
# Enforcement: the Gradle build reads these keys; the app version keys are read only by the
# civicwindow.android-application convention plugin, which fails on a part out of range.
# A check that a release tag equals this version is added with the release workflow (the
# release process); until then review is the check.

# Daemon memory. Reason: the default heap is too small for an Android build with Compose.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Build cache. Reason: reuse task outputs between builds and clones of the same inputs.
org.gradle.caching=true

# Configuration cache. Reason: skip configuration when the build inputs are unchanged.
org.gradle.configuration-cache=true

# Kotlin code style. Reason: the official Kotlin conventions are the project's style
# (ADR-0006).
kotlin.code.style=official

# App version, written once here (the release process names this file as the place).
# MAJOR.MINOR.PATCH follows Semantic Versioning 2.0.0 (https://semver.org/); the starting
# values and the use of this file are the project's choice: no standard covers this.
# The version name is major.minor.patch; the version code is computed from all four parts
# by the formula in the release process. Each of minor, patch and build runs from 0 to 99.
civicwindow.version.major=0
civicwindow.version.minor=1
civicwindow.version.patch=0
civicwindow.version.build=1
