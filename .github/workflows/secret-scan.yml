# Enforcement: GitHub runs this workflow on every pull request and push to dev and main; the job `secret-scan` becomes a required check when the project owner selects it in the repository settings. Until the first CI run, review is the check.
#
# Scans the full history and the working tree for committed secrets with the Gitleaks command-line program (docs/security/README.md, "Signing keys and secrets"; OWASP Secrets Management Cheat Sheet).
# The packaged Gitleaks action is not used: it needs a licence key for an organization account, and this workflow uses no key and no secret.
# Standards: GitHub Actions "Secure use reference" (least-privilege token permissions, actions pinned by full commit id) and the workflow syntax reference.
# Every pin and command below is checked again at the first CI run.

name: Secret scan

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# The default token reads repository contents and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Gitleaks v8.30.1 (tag commit 83d9cd684c87d95d656c1458ef04895a7f1cbd8e).
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, as the release page shows it for that file.
      GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The program is downloaded into the runner's temporary folder, so the scan of the working tree never reads it.
      - name: Download and verify Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

      # A finding is shown redacted. The job fails when the program exits with a non-zero status.
      - name: Scan the commit history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner .'

      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner .'
