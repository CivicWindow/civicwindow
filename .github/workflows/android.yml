# Enforcement: The hosting service runs this file on every pull request; branch protection makes the
# three jobs required once it is turned on when the repository is published.
#
# Standard: GitHub Actions workflow syntax and "Security hardening for GitHub Actions" (GitHub
# documentation): the token is limited to read access to repository contents, each action is
# pinned to a full commit id with its release in a comment, and each job has a timeout.
# Everything else in this file (the job names, the timeouts, the concurrency group, the seven-day
# retention) is the project's choice; no standard covers it.
#
# Debug builds only. No secret is used and nothing is signed or published. There is no path filter
# and no branch-ignore filter, because a required check whose workflow is skipped stays pending and
# blocks merging. The commands have not been run yet; the first run is the first run on the hosting
# service, which also checks the action inputs, the task names and the runner image name.

name: Android

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-build:
    name: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17" # the same value as jdk in gradle/libs.versions.toml

      # Validates the Gradle wrapper before it runs (the action's default).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The device tests are compiled here and run by hand on a physical device.
      - name: Build the debug app and compile the device tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest

  android-unit-tests:
    name: android-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17" # the same value as jdk in gradle/libs.versions.toml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The unit tests of the Android projects, the build-logic test and the coverage report.
      # No coverage threshold: the report is measured and shown, and nothing fails on its value.
      - name: Run the unit tests and make the coverage report
        run: ./gradlew testDebugUnitTest :build-logic:test createDebugUnitTestCoverageReport

      # A coverage report is not written when a test fails, so this step finds nothing then.
      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            app/build/reports/coverage/test/debug/
            modules/android/discovery/build/reports/coverage/test/debug/
          retention-days: 7

  android-static-analysis:
    name: android-static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17" # the same value as jdk in gradle/libs.versions.toml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The formatter check and Android Lint. build-logic is outside the formatter check.
      - name: Run the formatter check and Android Lint
        run: ./gradlew ktlintCheck lintDebug
